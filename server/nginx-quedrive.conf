# Contoh konfigurasi Nginx + PHP-FPM untuk QUEDRIVE di server.
# Sesuaikan: server_name, path folder project, dan socket/port PHP-FPM.
# Hanya folder public/ yang jadi root; app/, database/, storage/ dan .env (berisi password) tidak bisa dibuka dari browser.

server {
    listen 80;
    server_name quedrive.local;

    root /var/www/quedrive/public;
    index index.php;

    # halaman dashboard
    location = / {
        try_files /index.php =404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;   # atau 127.0.0.1:9000
    }

    # semua /api/* ditangani public/api/index.php
    location /api/ {
        try_files $uri /api/index.php$is_args$args;
    }

    location = /api/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;   # atau 127.0.0.1:9000
        fastcgi_read_timeout 120s;
    }

    # file PHP lain dan file tersembunyi (.env, .git) tidak boleh diakses
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
